android.useAndroidX=true
android.enableJetifier=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
kotlin.code.style=official

# Release signing configuration
# These values should be set in local.properties or CI environment
# For local development, create a keystore and run:
#   ./gradlew assembleRelease
RELEASE_KEYSTORE_PATH=app/release.keystore
RELEASE_KEYSTORE_PASSWORD=
RELEASE_KEY_ALIAS=
RELEASE_KEY_PASSWORD=

# Security settings
android.injected.keystore.store.password=${KEYSTORE_PASSWORD}
android.injected.keystore.key.alias=${KEY_ALIAS}
android.injected.keystore.key.password=${KEY_PASSWORD}

# Enable R8 full mode for better obfuscation
android.enableR8.fullMode=true

# Enable resource shrinking
android.enableR8.shrinking=true

# Disable build features not needed
android.defaults.buildfeatures.buildconfig=true
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false
