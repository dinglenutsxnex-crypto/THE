plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Load signing configuration
apply from: '../sign.gradle'

android {
    namespace 'com.nexora.hammerscale'
    compileSdk 34

    defaultConfig {
        applicationId "com.nexora.hammerscale"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
        
        // Enable native code compilation
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
        }
        
        // Enable custom security module
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
        
        // Disable jumbo builds for faster compilation
        compileOptions {
            jumboMode = true
        }
    }

    // Configure native build
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version "3.22.1"
        }
    }

    buildTypes {
        release {
            // Enable full minification and obfuscation
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            // Disable debugging features in release
            debuggable false
            jniDebuggable false
            
            // Enable signing
            signingConfig signingConfigs.release
            
            // Enable R8 full mode
            android.enableR8.fullMode = true
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
            
            // In debug builds, allow limited functionality for development
            // Security checks will still run but won't block the app
            ext.enableSecurityChecks = false
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
        jniLibs {
            useLegacyPackaging true
        }
    }
    
    // Prevent stripping of native libraries
    android.packagingOptions.jniLibs.keepDebugSymbols.add('')
    
    // Lint options
    lint {
        abortOnError true
        checkReleaseBuilds true
        warningsAsErrors false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
    
    // Security libraries
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}
