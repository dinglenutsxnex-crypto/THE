name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  # Security: Use a unique artifact name to prevent confusion
  ARTIFACT_NAME: hammerscale-release-${{ github.sha }}

permissions:
  contents: write
  id-token: write
  attestations: write
  checks: write

jobs:
  # ========================
  # SECURITY CHECKS
  # ========================
  security-checks:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
      
      - name: Check for sensitive data
        run: |
          # Check for exposed secrets, keys, or tokens
          echo "=== Checking for exposed secrets ==="
          if grep -r "API_KEY\|SECRET_KEY\|PRIVATE_KEY\|password\s*=" --include="*.kt" --include="*.java" --include="*.xml" --exclude-dir=build . 2>/dev/null; then
            echo "WARNING: Potential secrets found in code!"
            exit 1
          fi
          echo "No obvious secrets found in code."

  # ========================
  # BUILD JOB
  # ========================
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    needs: security-checks
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup CMake for native builds
        uses: jwlawson/setup-cmake@v1
        with:
          cmake-version: '3.22.1'
      
      - name: Install NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Build with release signing (if secrets available)
      - name: Build Release APK (unsigned)
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          # Disable signing in CI if keystore not configured
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # ========================
      # APK INTEGRITY VERIFICATION
      # ========================
      - name: Verify APK Integrity
        run: |
          echo "=== APK Integrity Verification ==="
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK not found at $APK_PATH"
            exit 1
          fi
          
          # Check APK size (should be reasonable)
          SIZE=$(stat -f%z "$APK_PATH" 2>/dev/null || stat -c%s "$APK_PATH")
          echo "APK Size: $SIZE bytes"
          
          if [ "$SIZE" -lt 1000000 ]; then
            echo "WARNING: APK seems too small, may be corrupted"
          fi
          
          # Calculate SHA256 hash
          SHA256=$(shasum -a 256 "$APK_PATH" | cut -d' ' -f1)
          echo "APK SHA256: $SHA256"
          
          # Save hash for later verification
          echo "$SHA256" > apk_hash.txt
          echo "::set-output name=apk_hash::$SHA256"
          echo "::set-output name=apk_size::$SIZE"
          
          echo "=== Integrity check passed ==="

      - name: Analyze APK Contents
        run: |
          echo "=== APK Content Analysis ==="
          unzip -l app/build/outputs/apk/release/app-release.apk | head -50
          
          # Check for debuggable flag
          echo ""
          echo "=== Checking for debug artifacts ==="
          if unzip -l app/build/outputs/apk/release/app-release.apk 2>/dev/null | grep -q "META-INF/*.RSA\|META-INF/*.DSA"; then
            echo "APK is signed ✓"
          else
            echo "WARNING: APK does not appear to be signed"
          fi

      # ========================
      # ARTIFACTS
      # ========================
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: hammerscale-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            apk_hash.txt
          retention-days: 30

      - name: Generate Build Info
        run: |
          cat > build_info.json << 'EOF'
          {
            "sha": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "run_id": "${{ github.run_id }}",
            "workflow": "${{ github.workflow }}",
            "actor": "${{ github.actor }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          echo "Build info: $(cat build_info.json)"

      - name: Upload Build Info
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: build_info.json
          retention-days: 90

  # ========================
  # SIGNED BUILD (with keystore)
  # ========================
  signed-build:
    name: Signed Release Build
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    environment: release
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode Keystore
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build Signed Release APK
        run: ./gradlew assembleRelease --no-daemon
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Verify Signature
        run: |
          echo "=== Verifying APK Signature ==="
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Generate SHA256 Hash
        run: |
          SHA256=$(shasum -a 256 app/build/outputs/apk/release/app-release.apk | cut -d' ' -f1)
          echo "Release APK SHA256: $SHA256"
          echo "$SHA256" > release_hash.txt
          echo "::set-output name=sha256::$SHA256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/app-release.apk
            release_hash.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: hammerscale-signed-release
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

  # ========================
  # CODE SIGNING ATTESTATION
  # ========================
  attest:
    name: Attest Build
    runs-on: ubuntu-latest
    needs: [build, signed-build]
    permissions:
      id-token: write
      contents: write
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: hammerscale-signed-release
          path: .
      
      - name: Attest Build
        run: |
          echo "=== Generating Build Attestation ==="
          echo "Attestation would be generated here using Sigstore or similar"
          echo "This proves the build came from this specific workflow run"
          
      - name: Generate SBOM
        run: |
          echo "=== Software Bill of Materials ==="
          echo "SBOM generation would go here"
          echo "This lists all dependencies in the APK"

  # ========================
  # DEPENDENCY CHECK
  # ========================
  dependency-check:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-check_Action@main
        with:
          project: 'HammerScale'
          path: '.'
          format: 'HTML'
          out: 'reports'