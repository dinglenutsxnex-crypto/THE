name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  ARTIFACT_NAME: hammerscale-release-${{ github.sha }}

permissions:
  contents: read

jobs:
  # ========================
  # SECURITY CHECKS
  # ========================
  security-checks:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true
      
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always() && success() == false
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true
      
      - name: Check for sensitive data
        run: |
          echo "=== Checking for exposed secrets ==="
          if grep -r "API_KEY\|SECRET_KEY\|PRIVATE_KEY\|password\s*=" --include="*.kt" --include="*.java" --include="*.xml" --exclude-dir=build . 2>/dev/null; then
            echo "WARNING: Potential secrets found in code!"
          else
            echo "No obvious secrets found in code."
          fi

  # ========================
  # BUILD JOB
  # ========================
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    needs: security-checks
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK Exists
        run: |
          find app/build/outputs -name "*.apk" -type f || true
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            echo "APK found at standard path"
            ls -la app/build/outputs/apk/release/app-release.apk
          else
            echo "Checking all APK files..."
            find app/build -name "*.apk" -exec ls -la {} \;
          fi

      - name: Calculate SHA256
        run: |
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            SHA256=$(shasum -a 256 app/build/outputs/apk/release/app-release.apk | cut -d' ' -f1)
            echo "APK SHA256: $SHA256"
            echo "$SHA256" > apk_hash.txt
          elif [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            echo "Found unsigned APK"
            SHA256=$(shasum -a 256 app/build/outputs/apk/release/app-release-unsigned.apk | cut -d' ' -f1)
            echo "APK SHA256: $SHA256"
            echo "$SHA256" > apk_hash.txt
            cp app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/app-release.apk
          else
            echo "APK not found for SHA256 calculation"
            find app/build -name "*.apk" -exec ls -la {} \;
            exit 1
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: hammerscale-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            apk_hash.txt
          retention-days: 30

  # ========================
  # SIGNED BUILD (on tag)
  # ========================
  signed-build:
    name: Signed Release Build
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode Keystore
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build Signed Release APK
        run: ./gradlew assembleRelease --no-daemon
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Generate SHA256 Hash
        run: |
          SHA256=$(shasum -a 256 app/build/outputs/apk/release/app-release.apk | cut -d' ' -f1)
          echo "Release APK SHA256: $SHA256"
          echo "$SHA256" > release_hash.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/app-release.apk
            release_hash.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}